{{ define "main" }}
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url={{ .Params.redirect_to }}">
<header class="page-header"><h1>{{ .Title }}</h1></header>
<div class="post-content"><p>포트폴리오 페이지로 이동합니다.</p><p><a href="{{ .Params.redirect_to }}">포트폴리오 열기 →</a></p></div>
<script>location.replace({{ .Params.redirect_to | jsonify | safeJS }});</script>
{{ end }}
