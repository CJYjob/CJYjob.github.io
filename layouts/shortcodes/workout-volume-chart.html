{{ $days := .Get "days" | default "30" }}
<div class="workout-volume-chart-wrapper" style="position:relative;height:400px;margin:1em 0;">
  <canvas id="workout-volume-chart-{{ .Ordinal }}"></canvas>
</div>
<script>
(function() {
  const loadChartJs = () => new Promise((resolve, reject) => {
    if (window.Chart) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

  const data = JSON.parse({{ site.Data.workout | jsonify }});
  const days = {{ $days }};
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const strength = data.filter(r => r.type === 'strength' && r.date >= cutoffStr);
  const dates = [...new Set(strength.map(r => r.date))].sort();

  const muscleOrder = [
    'Upper Pectoralis Major',
    'Middle Trapezius',
    'Latissimus Dorsi',
    'Rear Deltoids',
    'Lateral Deltoids',
    'Biceps Brachii',
    'Other'
  ];

  const muscleColor = {
    'Upper Pectoralis Major': 'hsl(0, 65%, 55%)',
    'Middle Trapezius': 'hsl(210, 65%, 55%)',
    'Latissimus Dorsi': 'hsl(135, 65%, 55%)',
    'Rear Deltoids': 'hsl(260, 65%, 55%)',
    'Lateral Deltoids': 'hsl(285, 65%, 55%)',
    'Biceps Brachii': 'hsl(35, 65%, 55%)',
    'Other': 'hsl(60, 45%, 55%)'
  };

  const fallbackMuscleColor = muscle => {
    let hash = 0;
    for (let i = 0; i < muscle.length; i++) {
      hash = ((hash << 5) - hash) + muscle.charCodeAt(i);
      hash |= 0;
    }
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 55%, 55%)`;
  };

  const colorForMuscle = muscle => muscleColor[muscle] || fallbackMuscleColor(muscle);

  const targetMusclesByExercise = new Map();
  const primaryMuscleByExercise = new Map();
  strength.forEach(r => {
    if (!primaryMuscleByExercise.has(r.exercise)) {
      const muscles = Array.isArray(r.target_muscles) && r.target_muscles.length > 0
        ? r.target_muscles
        : ['Other'];
      targetMusclesByExercise.set(r.exercise, muscles);
      primaryMuscleByExercise.set(r.exercise, muscles[0] || 'Other');
    }
  });

  const muscleRank = muscle => {
    const idx = muscleOrder.indexOf(muscle);
    return idx === -1 ? muscleOrder.length : idx;
  };

  const exercises = [...new Set(strength.map(r => r.exercise))].sort((a, b) => {
    const muscleA = primaryMuscleByExercise.get(a) || 'Other';
    const muscleB = primaryMuscleByExercise.get(b) || 'Other';
    const rankDiff = muscleRank(muscleA) - muscleRank(muscleB);
    if (rankDiff !== 0) return rankDiff;
    return a.localeCompare(b);
  });

  const datasets = exercises.map(ex => {
    const muscle = primaryMuscleByExercise.get(ex) || 'Other';

    return {
      label: ex,
      data: dates.map(d => {
        const recs = strength.filter(r => r.date === d && r.exercise === ex);
        return recs.reduce((sum, r) => sum + (r.sets || []).reduce((s, set) => s + (set.volume_kg || 0), 0), 0);
      }),
      backgroundColor: colorForMuscle(muscle)
    };
  });

  loadChartJs().then(() => {
    const ctx = document.getElementById('workout-volume-chart-{{ .Ordinal }}');
    new Chart(ctx, {
      type: 'bar',
      data: { labels: dates, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: `웨이트 (${days}일)` },
          legend: { position: 'bottom' },
          tooltip: {
            callbacks: {
              afterLabel: function(context) {
                const exercise = context.dataset.label;
                const muscles = targetMusclesByExercise.get(exercise) || ['Other'];
                return `Targets: ${muscles.join(', ')}`;
              }
            }
          }
        },
        scales: {
          x: { stacked: true, title: { display: true, text: 'Date' } },
          y: { stacked: true, title: { display: true, text: 'Volume (kg)' }, beginAtZero: true }
        }
      }
    });
  });
})();
</script>
