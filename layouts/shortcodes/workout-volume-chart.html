{{ $days := .Get "days" | default "30" }}
<div class="workout-volume-chart-wrapper" style="position:relative;height:400px;margin:1em 0;">
  <canvas id="workout-volume-chart-{{ .Ordinal }}"></canvas>
</div>
<script>
(function() {
  const loadChartJs = () => new Promise((resolve, reject) => {
    if (window.Chart) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });

  const data = JSON.parse({{ site.Data.workout | jsonify }});
  const mapping = JSON.parse({{ site.Data.workout_mapping | jsonify }});
  const days = {{ $days }};
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const strength = data.filter(r => r.type === 'strength' && r.date >= cutoffStr);
  const dates = [...new Set(strength.map(r => r.date))].sort();

  const muscleOrder = [
    'Upper Pectoralis Major',
    'Pectoralis Major',
    'Lower Pectoralis Major',
    'Latissimus Dorsi',
    'Middle Trapezius',
    'Posterior Deltoids',
    'Rear Deltoids',
    'Lateral Deltoids',
    'Biceps Brachii',
    'Hip Adductors',
    'Gluteus Medius',
    'Lower Body Muscles',
    'Quadriceps',
    'Hamstrings',
    'Other'
  ];

  const muscleColor = {
    'Upper Pectoralis Major': 'hsl(0, 75%, 55%)',
    'Pectoralis Major': 'hsl(0, 60%, 55%)',
    'Lower Pectoralis Major': 'hsl(0, 45%, 55%)',
    'Latissimus Dorsi': 'hsl(135, 65%, 55%)',
    'Middle Trapezius': 'hsl(210, 65%, 55%)',
    'Posterior Deltoids': 'hsl(260, 65%, 55%)',
    'Rear Deltoids': 'hsl(260, 55%, 55%)',
    'Lateral Deltoids': 'hsl(285, 65%, 55%)',
    'Biceps Brachii': 'hsl(35, 65%, 55%)',
    'Hip Adductors': 'hsl(315, 45%, 55%)',
    'Gluteus Medius': 'hsl(110, 45%, 50%)',
    'Lower Body Muscles': 'hsl(45, 65%, 50%)',
    'Quadriceps': 'hsl(45, 70%, 52%)',
    'Hamstrings': 'hsl(25, 60%, 50%)',
    'Other': 'hsl(60, 45%, 55%)'
  };

  const fallbackMuscleColor = muscle => {
    let hash = 0;
    for (let i = 0; i < muscle.length; i++) {
      hash = ((hash << 5) - hash) + muscle.charCodeAt(i);
      hash |= 0;
    }
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 55%, 55%)`;
  };

  const colorForMuscle = muscle => muscleColor[muscle] || fallbackMuscleColor(muscle);

  const mappingByExercise = new Map();
  const multiTargetMappings = [];

  mapping.forEach(item => {
    if (!item || !item.exercise) return;
    const muscles = Array.isArray(item.target_muscles) && item.target_muscles.length > 0
      ? item.target_muscles
      : ['Other'];

    mappingByExercise.set(item.exercise, muscles);

    if (muscles.length > 1) {
      multiTargetMappings.push(`${item.exercise}: ${muscles.join(', ')}`);
    }
  });

  if (multiTargetMappings.length > 0) {
    console.warn(
      '[workout-volume-chart] Multi-target mappings found. The chart uses the first target muscle as the primary target for aggregation:',
      multiTargetMappings
    );
  }

  const primaryTargetForRecord = record => {
    const mapped = mappingByExercise.get(record.exercise);
    if (mapped && mapped.length > 0) return mapped[0];

    const recordMuscles = Array.isArray(record.target_muscles) && record.target_muscles.length > 0
      ? record.target_muscles
      : ['Other'];

    return recordMuscles[0] || 'Other';
  };

  const volumeByDateAndMuscle = new Map();
  const exercisesByDateAndMuscle = new Map();

  strength.forEach(record => {
    const muscle = primaryTargetForRecord(record);
    const volume = (record.sets || []).reduce((sum, set) => sum + (Number(set.volume_kg) || 0), 0);
    const key = `${record.date}||${muscle}`;

    volumeByDateAndMuscle.set(key, (volumeByDateAndMuscle.get(key) || 0) + volume);

    if (!exercisesByDateAndMuscle.has(key)) {
      exercisesByDateAndMuscle.set(key, new Set());
    }
    exercisesByDateAndMuscle.get(key).add(record.exercise);
  });

  const muscles = [...new Set(strength.map(primaryTargetForRecord))].sort((a, b) => {
    const rankA = muscleOrder.indexOf(a);
    const rankB = muscleOrder.indexOf(b);
    const safeRankA = rankA === -1 ? muscleOrder.length : rankA;
    const safeRankB = rankB === -1 ? muscleOrder.length : rankB;
    if (safeRankA !== safeRankB) return safeRankA - safeRankB;
    return a.localeCompare(b);
  });

  const datasets = muscles.map(muscle => ({
    label: muscle,
    data: dates.map(date => volumeByDateAndMuscle.get(`${date}||${muscle}`) || 0),
    backgroundColor: colorForMuscle(muscle)
  }));

  loadChartJs().then(() => {
    const ctx = document.getElementById('workout-volume-chart-{{ .Ordinal }}');
    new Chart(ctx, {
      type: 'bar',
      data: { labels: dates, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: { display: true, text: `웨이트 볼륨 - 타게 근유별, (${days}일)` },
          legend: { position: 'bottom' },
          tooltip: {
            callbacks: {
              afterLabel: function(context) {
                const muscle = context.dataset.label;
                const date = context.label;
                const exercises = exercisesByDateAndMuscle.get(`${date}||${muscle}`);
                if (!exercises || exercises.size === 0) return '';
                return `Exercises: ${[...exercises].join(', ')}`;
              }
            }
          }
        },
        scales: {
          x: { stacked: true, title: { display: true, text: 'Date' } },
          y: { stacked: true, title: { display: true, text: 'Volume (kg)' }, beginAtZero: true }
        }
      }
    });
  });
})();
</script>
