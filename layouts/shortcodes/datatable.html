{{- $key := .Get "activity" -}}
{{- with index site.Data $key -}}
<table>
  <thead><tr>{{- range $k, $v := (index . 0) }}<th>{{ $k }}</th>{{- end }}</tr></thead>
  <tbody>
  {{- range . }}<tr>{{- range $k, $v := . }}<td>{{ $v }}</td>{{- end }}</tr>{{- end }}
  </tbody>
</table>
{{- else -}}<p>표시할 데이터가 없습니다: <code>{{ $key }}</code></p>{{- end -}}
