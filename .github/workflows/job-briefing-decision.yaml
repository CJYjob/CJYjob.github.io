name: Close Daily Job Briefing Cycle

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-briefing-decision-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      startsWith(github.event.issue.title, '[Daily Job Briefing]') &&
      (startsWith(github.event.comment.body, '/take ') || github.event.comment.body == '/no-action')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record decision
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! python scripts/job_briefing.py decide --issue-title "${ISSUE_TITLE}" --comment "${COMMENT_BODY}"; then
            gh issue comment "${ISSUE_NUMBER}" --body '결정 기록에 실패했습니다. `/take ITEM_ID` 또는 `/no-action` 형식과 ITEM_ID를 확인해주세요.'
            exit 1
          fi
      - name: Commit decision
        run: |
          if git diff --quiet -- data/job-briefing/decisions; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job-briefing/decisions
          git commit -m "Record daily job briefing decision"
          git pull --rebase origin main
          git push origin main
      - name: Close cycle
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" --body "오늘 정보 소비 사이클을 \`closed\`로 기록했습니다."
          gh issue close "${ISSUE_NUMBER}"
