name: Daily investment analysis and review

on:
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "0 20 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle to run"
        required: true
        type: choice
        options:
          - morning
          - evening
      date:
        description: "Optional KST date override (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: investment-daily
  cancel-in-progress: false

jobs:
  investment-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install investment automation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26" \
            "pandas>=2.2" \
            "requests>=2.31" \
            "yfinance>=0.2.54"

      - name: Resolve cycle
        id: cycle
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.cycle }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 20 * * 1-5" ]]; then
            echo "value=evening" >> "$GITHUB_OUTPUT"
          else
            echo "value=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Run investment automation
        shell: bash
        run: |
          args=(--cycle "${{ steps.cycle.outputs.value }}")
          if [[ -n "${{ inputs.date }}" ]]; then
            args+=(--date "${{ inputs.date }}")
          fi
          python scripts/investment_automation.py "${args[@]}"

      - name: Commit generated investment artifacts
        shell: bash
        run: |
          git add data/investment_daily.json data/investment_performance.json
          git add content/ko/log/etf-live-trading/
          if git diff --cached --quiet; then
            echo "No investment artifact changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily investment analysis"
          git pull --rebase origin main
          git push origin HEAD:main
