baseURL: "https://cjyjob.github.io/"
languageCode: "ko-kr"
title: "최준영의 자람"
theme: "PaperMod"
googleAnalytics: "G-5TKCHJG4NQ"
enableRobotsTXT: true

buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

menu:
  main:
    - identifier: diary
      name: 📔 일기장
      url: /diary/
      weight: 10
    - identifier: gallery
      name: 🖼️ 전시실
      url: /gallery/
      weight: 20
    - identifier: lab
      name: 🧪 실험실
      url: /lab/
      weight: 30
    - identifier: about
      name: 📋 About
      url: /about/
      weight: 40
    - identifier: search
      name: 🔍 검색
      url: /search/
      weight: 50

params:
  env: production
  title: "최준영의 자람"
  description: "배우고, 경험하고, 성장하는 기록"
  keywords: [보안, Security, 개발, Development, 성장, 기록]
  author: "최준영"
  
  defaultTheme: auto
  disableThemeToggle: false
  
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  
  homeInfoParams:
    Title: "🌱 최준영의 자람"
    Content: "배우고, 경험하고, 성장하는 과정을 기록합니다."
  
  socialIcons:
    - name: github
      url: "https://github.com/CJYjob"
  
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags
  series: series
