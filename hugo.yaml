baseURL: "https://cjyjob.github.io/"
languageCode: "ko-kr"
title: "최준영의 자람"
theme: "PaperMod"
timeZone: "Asia/Seoul"
googleAnalytics: "G-5TKCHJG4NQ"
enableRobotsTXT: true

buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

menu:
  main:
    - { identifier: log,       name: "📒 Log",       url: /log/,       weight: 10 }
    - { identifier: portfolio, name: "🗂️ Portfolio", url: /portfolio/, weight: 20 }
    - { identifier: about,     name: "📋 About",     url: /about/,     weight: 30 }
    - { identifier: search,    name: "🔍 검색",      url: /search/,    weight: 40 }

params:
  env: production
  title: "최준영의 자람"
  description: "배우고, 경험하고, 성장하는 기록"
  keywords: [보안, Security, 개발, Development, AI, RPA, 성장, 기록]
  author: "최준영"

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
  
  defaultTheme: auto
  disableThemeToggle: false
  
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  
  mainSections:
    - log
    - portfolio
  
  homeInfoParams:
    Title: "🌱 최준영의 자람"
    Content: "배우고, 경험하고, 성장하는 과정을 기록핉는다."
  
  socialIcons:
    - name: github
      url: "https://github.com/CJYjob"
  
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

pagination:
  pagerSize: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  tag: tags
  series: series
